# https://taskfile.dev
version: "3"

tasks:

  binary:
    desc: Build a Linux labelsync into dev/, for the recording container to run
    internal: true
    vars:
      LABELSYNC_VERSION:
        sh: described=$(git describe --tags --always --dirty="-dev" 2>/dev/null || echo "dev"); echo "${described#v}"
    cmds:
      # GOOS=linux regardless of the host, because the tape runs inside the vhs
      # image. dest=dev keeps it clear of `task build`'s ./labelsync.
      - >-
        docker buildx bake --file compose.yml
        --set "go-binary.output=type=local,dest=dev"
        --set "go-binary.args.GOOS=linux"
        --set "go-binary.args.GOARCH={{ARCH}}"
        --set "go-binary.args.LABELSYNC_VERSION={{.LABELSYNC_VERSION}}"
        go-binary

  record:*:
    desc: Re-record one demo GIF — `task demo:record:labelsync`, `task demo:record:init`
    summary: |
      Builds a Linux labelsync, then runs docs/demo/<name>.tape in the pinned vhs
      image, overwriting the GIF that tape names in its Output line.

      One tape at a time, on purpose: every recording produces different bytes
      even when nothing it shows has changed, so recording all of them dirties
      GIFs nobody asked about.

        task demo:record:labelsync   # groups + sync --dry-run, needs a token
        task demo:record:init        # the init scaffold, offline

      The token is GH_TOKEN, or a logged-in `gh` on the host. Only `public_repo`
      scope is needed: the recorded commands read the labels of three public
      repositories, and write to nothing.
    vars:
      TAPE: '{{ index .MATCH 0 }}'
    env:
      GH_TOKEN:
        sh: echo "${GH_TOKEN:-$(gh auth token 2>/dev/null)}"
    preconditions:
      - sh: test -f docs/demo/{{.TAPE}}.tape
        msg: "No such tape: docs/demo/{{.TAPE}}.tape"
      # Only the tapes that reach the API need one; init records offline.
      - sh: >-
          ! grep -qE '^Type "labelsync (sync|export|groups|cache)' docs/demo/{{.TAPE}}.tape
          || test -n "${GH_TOKEN:-}" || gh auth token >/dev/null 2>&1
        msg: |
          No GitHub token. Export GH_TOKEN, or run `gh auth login` — this tape
          reads labels from the API and labelsync has no anonymous path.
    cmds:
      - task: binary
      # Not routed through :dc:run:*, because a task's env: does not follow a
      # task call and compose interpolates GH_TOKEN from its own environment.
      - >-
        FIXUID=${FIXUID:-$(id -u)} FIXGID=${FIXGID:-$(id -g)}
        docker compose run --rm vhs {{.TAPE}}.tape
