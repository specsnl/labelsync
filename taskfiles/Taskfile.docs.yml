# https://taskfile.dev
version: "3"

tasks:

  build:
    desc: Build the static documentation site into docs/public/
    cmds:
      - task: :dc:run:hugo
        vars:
          SUB_CMD: --minify

  serve:
    desc: Start the Hugo development server with live reload (http://localhost:1313)
    cmds:
      - task: :dc
        vars:
          SUB_CMD: "run --rm --service-ports hugo server --bind 0.0.0.0"

  preview:
    desc: Build and serve the static docs site locally (http://localhost:8080)
    summary: |
      Builds with --baseURL http://localhost:8080 so the generated absolute URLs
      point at the preview, then serves docs/public/ over nginx — the same static
      output GitHub Pages gets, rather than the dev server's live-reload render.
    cmds:
      - task: :dc:run:hugo
        vars:
          SUB_CMD: --minify --baseURL http://localhost:8080
      - task: :dc
        vars:
          SUB_CMD: "run --rm --service-ports docs-preview"

  mod:tidy:
    desc: Tidy the Hugo module dependencies and regenerate docs/go.sum
    cmds:
      - task: :dc:run:hugo
        vars:
          SUB_CMD: mod tidy
