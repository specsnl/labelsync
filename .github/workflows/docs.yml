name: Deploy Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialised against every other Pages deployment, and never cancelled — a
# half-finished deploy would leave the live site on a partial artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  changes:
    name: Changes Filter
    runs-on: ubuntu-24.04
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            docs:
              - 'docs/**'
              - '.github/workflows/docs.yml'

  build:
    name: Build
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.docs == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # enableGitInfo needs the history to date each page.
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # Keep in step with the hugomods/hugo tag in compose.yml.
          hugo-version: 0.161.1
          extended: true

      - name: Cache Hugo modules
        uses: actions/cache@v6
        with:
          path: /tmp/hugo_cache
          key: ${{ runner.os }}-hugo-${{ hashFiles('docs/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-hugo-

      - name: Build
        env:
          HUGO_CACHEDIR: /tmp/hugo_cache
          HUGO_ENVIRONMENT: production
        run: hugo --minify
        working-directory: docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/public

  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
